name: Build DarkPrime JAR

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Check project folder
    run: |
      pwd
      ls -la
      ls -la DarkPrime

  - name: Build DarkPrime
    working-directory: DarkPrime
    run: |
      chmod +x gradlew
      ./gradlew build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: DarkPrime-JAR
      path: DarkPrime/build/libs/*.jar
      if-no-files-found: error
