name: Build DarkPrime JAR

on:
workflow_dispatch:
push:
branches: [main, master]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: DarkPrime

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Check project files
    run: |
      pwd
      ls -la
      test -f gradlew || test -f build.gradle || test -f build.gradle.kts

  - name: Build JAR
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew build --no-daemon
      else
        gradle build --no-daemon
      fi

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: DarkPrime-JAR
      path: DarkPrime/build/libs/*.jar
      if-no-files-found: error
