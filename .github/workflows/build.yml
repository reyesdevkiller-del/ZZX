name: DarkPrime Build
'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
- name: Java
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "21"
- name: Gradle
uses: gradle/actions/setup-gradle@v4
- name: Build
run: gradle build --no-daemon
