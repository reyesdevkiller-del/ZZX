name: Build DarkPrime JAR

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build DarkPrime
    run: |
      echo "Contenido del proyecto:"
      ls -la
      for i in 1 2 3; do
        if gradle build --no-daemon --refresh-dependencies; then
          exit 0
        fi
        echo "Compilación fallida. Reintento $i..."
        sleep 5
      done
      exit 1

  - name: Upload JAR
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: DarkPrime-JAR
      path: build/libs/*.jar
      if-no-files-found: error
