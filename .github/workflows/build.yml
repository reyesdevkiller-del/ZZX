name: Build DarkPrime JAR
'on':
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Locate Gradle project
    run: |
      echo "Repository root:"
      pwd
      ls -la
      echo "Searching for Gradle files:"
      find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -print

  - name: Build DarkPrime
    run: |
      cd DarkPrime
      chmod +x gradlew
      ./gradlew build --no-daemon

  - uses: actions/upload-artifact@v4
    with:
      name: DarkPrime-JAR
      path: DarkPrime/build/libs/*.jar
      if-no-files-found: error
