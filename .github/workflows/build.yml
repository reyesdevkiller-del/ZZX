name: Build DarkPrime JAR
'on':
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Show repository files
    run: |
      pwd
      ls -la
      find . -maxdepth 3 -name gradlew -o -name build.gradle -o -name build.gradle.kts

  - name: Build DarkPrime
    run: |
      cd DarkPrime
      chmod +x gradlew
      ./gradlew build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: DarkPrime-JAR
      path: DarkPrime/build/libs/*.jar
      if-no-files-found: error
