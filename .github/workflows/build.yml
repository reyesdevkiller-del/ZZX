
name: Build DarkPrime JAR

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DarkPrime
        shell: bash
        run: |
          echo "Contenido del repositorio:"
          ls -la

          if [ -d "DarkPrime" ]; then
            cd DarkPrime
          fi

          echo "Contenido del proyecto:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DarkPrime-JAR
          path: |
            DarkPrime/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
          
